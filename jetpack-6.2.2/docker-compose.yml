services:
  deepstream-dev:
    build:
      dockerfile: Dockerfile
      context: .
    tty: true
    stdin_open: true
    runtime: nvidia
    volumes:
      - ./src:/app/src
      - ~/data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all           # Number of GPUs, or use "all"
              capabilities: [gpu] # Required to enable GPU access
